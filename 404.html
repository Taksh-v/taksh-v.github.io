  <title>Page not found — Taksh Vadaliya</title>
  <style>
    :root{--paper:#f4f1e9;--ink:#191d1a;--muted:#727b73;--line:#d6d4c8;--acid:#e5f368;--rust:#cc6c4e;--serif:Georgia,"Times New Roman",serif;--mono:Consolas,monospace}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif}.card{width:min(600px,100%);padding:clamp(25px,7vw,54px);border:1px solid var(--line);background:#fbf9f3;position:relative}.card:after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--acid)}.code{color:var(--rust);font:11px var(--mono);letter-spacing:.16em;text-transform:uppercase}h1{font:clamp(42px,9vw,70px)/1 var(--serif);font-weight:400;letter-spacing:-.05em;margin:20px 0 12px}p{max-width:430px;color:var(--muted);line-height:1.7;margin:0 0 24px}.btn{display:inline-block;padding:11px 15px;background:var(--ink);color:var(--paper);text-decoration:none;border-radius:4px;font-size:12px;font-weight:700}.btn:hover{background:#303c34}a:focus-visible{outline:3px solid #637737;outline-offset:4px}
  </style>
</head>
<body><main class="card"><span class="code">404 / route not found</span><h1>This page went off route.</h1><p>The link may be old or mistyped. Head back to the portfolio to see the current work and projects.</p><a class="btn" href="/">Return to Taksh’s portfolio ↗</a></main></body>
