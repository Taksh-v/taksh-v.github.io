<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gate closed — Taksh Vadaliya</title>
<meta name="robots" content="noindex" />
<style>
  :root{--void:#0C0B0A;--tile:#221E1A;--mari:#D98324;--ink:#F7F5EF;--ink-3:rgba(247,245,239,.42);
        --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;background:var(--void);color:var(--ink);font-family:var(--mono);
       display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .card{max-width:520px}
  .code{display:inline-flex;gap:3px;margin-bottom:26px}
  .c{width:.62em;height:1.3em;background:var(--tile);border-radius:2px;display:grid;place-items:center;
     font-size:34px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5);position:relative;overflow:hidden}
  .c::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#0A0908}
  h1{font-size:15px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;margin:0 0 12px}
  p{color:var(--ink-3);font-size:14px;line-height:1.7;margin:0 0 22px}
  a{display:inline-flex;align-items:center;gap:8px;color:#141110;background:var(--mari);border-radius:6px;
    padding:11px 16px;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;font-weight:500}
  a:hover{background:#E8912F}
</style>
</head>
<body>
  <div class="card">
    <div class="code" aria-hidden="true"><span class="c">4</span><span class="c">0</span><span class="c">4</span></div>
    <h1>Gate closed</h1>
    <p>That page isn't on the board. Nothing else is affected — the departures are all still boarding.</p>
    <a href="/">← Back to the board</a>
  </div>
</body>
</html>
